notes: |
  C-MASP: Cascaded Multi-Modal Adaptive Semantic Partitioning Video Chunker.
  - Zero-Weight CPU Mode: python src/main.py --input <path_to_video> --encoder fast_spatial --device cpu
  - GPU ViT Mode: python src/main.py --input <path_to_video> --encoder open_clip --device cuda
  - VideoMME Benchmark: python src/main.py --benchmark --data-dir ./data
